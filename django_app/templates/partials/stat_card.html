<!-- Usage: {% include "partials/stat_card.html" with icon="bi-database" label="Total Records" value=total_records color="primary" %} -->
<div class="card stat-card border-0 shadow-sm h-100">
  <div class="card-body d-flex align-items-center gap-3">
    <div class="stat-icon rounded-circle d-flex align-items-center justify-content-center bg-{{ color|default:'primary' }} bg-opacity-10">
      <i class="bi {{ icon }} text-{{ color|default:'primary' }} fs-4"></i>
    </div>
    <div>
      <div class="stat-value fw-bold fs-4">{{ value }}</div>
      <div class="stat-label text-muted small">{{ label }}</div>
    </div>
  </div>
</div>
